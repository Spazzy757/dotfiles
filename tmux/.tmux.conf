# =============================================================================
# Prefix
# =============================================================================

unbind C-b
set -g prefix C-a
bind C-a send-prefix  # pass Ctrl+a through to nested sessions

# =============================================================================
# Terminal
# =============================================================================

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"  # enable true colour

# =============================================================================
# General
# =============================================================================

set -g mouse on
set -g history-limit 50000
set -g base-index 1          # start window numbering at 1
setw -g pane-base-index 1   # start pane numbering at 1
set -g renumber-windows on   # fill gaps when a window is closed
set -sg escape-time 0        # no delay after Escape (important for Neovim)
set -g focus-events on       # pass focus events to applications (e.g. vim autoread)
set -g set-titles on
set -g detach-on-destroy off # keep session alive when last window closes

# =============================================================================
# Windows & Panes
# =============================================================================

# Open new windows/panes in the current working directory
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind x kill-pane

# Swap current pane with the top pane
bind T swap-pane -s . -t top \; select-pane -t top

# =============================================================================
# Navigation
# =============================================================================

# Vim-style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# =============================================================================
# Copy Mode (vi)
# =============================================================================

setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"  # yank to Wayland clipboard
bind p paste-buffer

# =============================================================================
# Status Bar
# =============================================================================

set -g status-position bottom
set -g status-interval 5
set -g status-left " #S "
set -g status-right " %H:%M %d-%b "
set -g status-left-length 20
set -g status-right-length 30

# =============================================================================
# Auto-start Sessions
# =============================================================================

# Recreate these named sessions (in their working directory) whenever the
# tmux server starts fresh and they don't already exist. Guarded by
# has-session, so it's a no-op for sessions still running, and also re-runs
# on config reload (bind r below) — so a closed session comes back on the
# next reload too, not just after a full server restart.
if-shell '! tmux has-session -t CISSP 2>/dev/null'             'new-session -d -s CISSP -c /home/spazzy/repos/vandebron/cissp'
if-shell '! tmux has-session -t compliance 2>/dev/null'        'new-session -d -s compliance -c /home/spazzy/repos/vandebron/compliance'
if-shell '! tmux has-session -t dotfiles 2>/dev/null'          'new-session -d -s dotfiles -c /home/spazzy/repos/dotfiles'
if-shell '! tmux has-session -t term 2>/dev/null'              'new-session -d -s term -c /home/spazzy/repos/vandebron/compliance'

# =============================================================================
# Misc
# =============================================================================

bind r source-file ~/.tmux.conf \; display "Config reloaded!"
